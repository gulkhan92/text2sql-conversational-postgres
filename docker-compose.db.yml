services:
  db:
    image: postgres:15
    container_name: text2sql_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=db
      - CSV_PATH=/app/customer_spending_1M_2018_2025.csv
      - GEMINI_MODEL=${GEMINI_MODEL}
    volumes:
      - ./:/app
    depends_on:
      - db

volumes:
  pgdata:
